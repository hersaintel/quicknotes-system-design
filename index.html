<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes API Client</title>
    <link rel="stylesheet" href="style.css" />
    <script src="api.js" defer></script>
  </head>
  <body>
    <header>
      <h1>QuickNotes</h1>
      <p>An API client that talks to the JSONPlaceholder practice API</p>
    </header>

    <main>
      <section aria-labelledby="create-heading">
        <h2 id="create-heading">Create a note</h2>
        <form id="note-form" novalidate>
          <label for="title-input">Title (required, up to 100 characters)</label>
          <input type="text" id="title-input" name="title" autocomplete="off" />

          <label for="body-input">Body (optional)</label>
          <textarea id="body-input" name="body" rows="4"></textarea>

          <button type="submit" id="submit-btn">Create note</button>
        </form>
      </section>

      <section aria-labelledby="notes-heading">
        <h2 id="notes-heading">Your notes</h2>
        <button type="button" id="load-btn">Load notes</button>
        <p id="status" class="status" role="status"></p>
        <ul id="notes-list"></ul>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 QuickNotes. Built during Web Foundations.</p>
    </footer>
  </body>
</html>
